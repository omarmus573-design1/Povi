<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Povi — Connection, not popularity</title>


<style>
:root{
  --bg:#f3eadb;
  --card:#fffaf2;
  --ink:#342d27;
  --muted:#756a60;
  --line:#ded1c1;
  --accent:#657d68;

  --green:#dce8d9;
  --yellow:#f5e6b5;
  --blue:#dce8ef;
  --purple:#e5dceb;
  --orange:#f1dfcf;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:16px system-ui,-apple-system,Segoe UI,sans-serif
}

button,input,select{
  font:inherit
}

button{
  cursor:pointer
}

.app{
  max-width:760px;
  margin:auto;
  min-height:100vh;
  padding:24px
}

.brand{
  font-weight:800;
  font-size:28px;
  letter-spacing:.5px
}

.tag{
  color:var(--muted);
  margin-top:2px
}

.screen{
  padding:58px 0 100px
}

h1{
  font-size:clamp(30px,7vw,48px);
  line-height:1.08;
  letter-spacing:-1px;
  margin:0 0 14px
}

h3{
  margin:38px 0 12px
}

.hero{
  font-size:clamp(38px,8vw,64px);
  line-height:1.02;
  letter-spacing:-2px;
  margin:25px 0
}

.muted{
  color:var(--muted);
  line-height:1.55
}

/* Cards are now quieter */
.card{
  background:var(--card);
  border:1px solid rgba(222,209,193,.9);
  border-radius:24px;
  padding:22px;
  margin:14px 0;
  box-shadow:0 5px 18px rgba(70,55,40,.05);
}

/* Only important areas get a soft surface */
.card:has(.row){
  padding:24px 0
}

.chips{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
  margin-top:24px
}

.chip{
  border:1px solid var(--line);
  background:var(--card);
  color:var(--ink);
  border-radius:999px;
  padding:10px 15px;
  transition:.15s
}

.chip.on{
  background:var(--ink);
  color:white;
  border-color:var(--ink)
}

.primary{
  background:var(--ink);
  color:#fff;
  border:0;
  border-radius:999px;
  padding:13px 20px
}

.ghost{
  background:transparent;
  color:var(--ink);
  border:1px solid var(--line);
  border-radius:999px;
  padding:11px 17px
}

.primary:hover,
.ghost:hover,
.chip:hover{
  transform:translateY(-1px)
}

.row{
  display:flex;
  justify-content:space-between;
  gap:20px;
  align-items:center
}

.question{
  font-size:23px;
  line-height:1.35;
  margin:8px 0
}

.post{
  white-space:pre-wrap;
  line-height:1.6
}

.count{
  font-size:12px;
  color:var(--muted);
  text-transform:none;
  letter-spacing:.3px
}

.input{
  width:100%;
  padding:15px;
  border:1px solid var(--line);
  border-radius:16px;
  background:rgba(255,250,242,.65);
  color:var(--ink);
  outline:none
}

.input:focus{
  border-color:var(--accent)
}

.nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:rgba(244,236,223,.92);
  border-top:1px solid var(--line);
  backdrop-filter:blur(12px)
}

.navin{
  max-width:760px;
  margin:auto;
  display:flex;
  justify-content:space-around;
  padding:9px
}

.nav button{
  border:0;
  background:transparent;
  color:var(--muted);
  padding:8px 12px
}

.nav button.active{
  color:var(--ink);
  font-weight:700
}

.small{
  font-size:13px
}

select.input{
  appearance:auto
}
  /* ---------- POVI HOME ---------- */

.homeIntro{
  margin-bottom:30px;
}

.homeEyebrow{
  font-size:13px;
  font-weight:700;
  color:var(--muted);
  letter-spacing:.5px;
  margin-bottom:9px;
}

.homeTitle{
  font-size:clamp(36px,8vw,56px);
  line-height:1.02;
  letter-spacing:-2px;
  margin:0;
}

.interestWorld{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
  margin:22px 0 34px;
}

.interest{
  padding:9px 14px;
  border-radius:999px;
  font-size:14px;
  border:1px solid transparent;
}

.interest:nth-child(4n+1){
  background:#dce8d9;
  border-color:#cbdcc7;
}

.interest:nth-child(4n+2){
  background:#f3e5bd;
  border-color:#e8d69d;
}

.interest:nth-child(4n+3){
  background:#dce7ed;
  border-color:#c9d9e2;
}

.interest:nth-child(4n){
  background:#e5ddec;
  border-color:#d6c8df;
}

.mirrorQuestion{
  background:#f3e5bd;
  border:1px solid #e7d59e;
  border-radius:25px;
  padding:22px;
  margin:0 0 30px;
}

.mirrorLabel{
  font-size:12px;
  font-weight:750;
  color:#756544;
  margin-bottom:10px;
  text-transform:uppercase;
  letter-spacing:.7px;
}

.mirrorQuestion .question{
  font-size:24px;
  margin:0;
}

.mirrorQuestion button{
  margin-top:15px;
}

.worldHeading{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:0 0 10px;
}

.worldHeading h3{
  margin:0;
}

.worldHeading span{
  font-size:13px;
  color:var(--muted);
}

.smallThought{
  display:flex;
  gap:14px;
  align-items:flex-start;
  padding:16px 2px;
  border-bottom:1px solid rgba(222,209,193,.8);
}

.smallThought:last-child{
  border-bottom:0;
}

.thoughtDot{
  width:38px;
  height:38px;
  min-width:38px;
  border-radius:13px;
  display:grid;
  place-items:center;
  font-size:18px;
}

.thoughtText{
  line-height:1.45;
}

.thoughtMeta{
  font-size:12px;
  color:var(--muted);
  margin-top:4px;
}

.homePaths{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:30px;
}

.homePath{
  padding:18px;
  border-radius:21px;
  min-height:125px;
}

.homePath b{
  display:block;
  margin-bottom:6px;
}

.homePath.green{
  background:#dce8d9;
}

.homePath.blue{
  background:#dce7ed;
}

.homePath.orange{
  background:#f0dfcf;
}

@media(max-width:520px){
  .homePaths{
    grid-template-columns:1fr;
  }
}
  .homeInterest{
  cursor:pointer;
  transition:.15s;
}

.homeInterest:hover{
  transform:translateY(-2px);
}

.homeQuestion{
  cursor:pointer;
  transition:.15s;
}

.homeQuestion:hover{
  transform:translateY(-2px);
}
  .convoIntro{
  margin-bottom:34px;
}

.convoEyebrow{
  font-size:12px;
  letter-spacing:1.5px;
  color:var(--muted);
  margin-bottom:10px;
}

.convoQuestion{
  cursor:pointer;
  padding:22px 4px;
  border-bottom:1px solid var(--line);
  transition:.15s;
}

.convoQuestion:hover{
  transform:translateX(3px);
}

.convoStar{
  font-size:22px;
  margin-right:8px;
}

.convoText{
  font-size:21px;
  line-height:1.4;
}

.convoMeta{
  color:var(--muted);
  font-size:13px;
  margin-top:9px;
}

.convoArrow{
  margin-top:12px;
  color:var(--accent);
  font-size:14px;
}

.convoRoom{
  max-width:680px;
}

.roomQuestion{
  font-size:25px;
  line-height:1.4;
  margin:18px 0 12px;
}

.roomPrompt{
  color:var(--muted);
  line-height:1.55;
  margin-bottom:24px;
}

.messageArea{
  margin-top:28px;
}

.messageArea textarea{
  min-height:120px;
  resize:vertical;
}

.backLink{
  border:0;
  background:transparent;
  color:var(--muted);
  padding:0;
  margin-bottom:25px;
  }
  .convoIntro{
  margin-bottom:38px;
}

.convoEyebrow{
  font-size:11px;
  letter-spacing:1.8px;
  color:var(--muted);
  margin-bottom:12px;
}

.convoQuestion{
  position:relative;
  padding:25px 20px 24px;
  margin:16px 0;
  border:1px solid var(--line);
  border-radius:26px;
  cursor:pointer;
  transition:.18s;
  overflow:hidden;
}

.convoQuestion:nth-of-type(odd){
  background:var(--green);
}

.convoQuestion:nth-of-type(even){
  background:var(--yellow);
}

.convoQuestion:hover{
  transform:translateY(-3px) rotate(-.2deg);
}

.convoQuestion:nth-of-type(3n){
  background:var(--blue);
}

.convoStar{
  display:inline-block;
  font-size:25px;
  margin-bottom:12px;
}

.convoText{
  display:block;
  font-size:22px;
  line-height:1.4;
  letter-spacing:-.3px;
}

.convoMeta{
  color:var(--muted);
  font-size:13px;
  margin-top:14px;
}

.convoArrow{
  margin-top:17px;
  font-size:14px;
  font-weight:600;
  color:var(--ink);
}

.convoHint{
  margin-top:7px;
  color:var(--muted);
  font-size:12px;
}

.convoQuestion::after{
  content:"";
  position:absolute;
  width:70px;
  height:70px;
  border-radius:50%;
  right:-28px;
  top:-28px;
  background:rgba(255,255,255,.28);
  }
  .discoverIntro{
  margin-bottom:36px;
}

.discoverEyebrow{
  font-size:11px;
  letter-spacing:1.8px;
  color:var(--muted);
  margin-bottom:12px;
}

.discoverPost{
  position:relative;
  padding:24px 20px;
  margin:16px 0;
  border-radius:26px;
  border:1px solid var(--line);
  overflow:hidden;
}

.discoverPost:nth-of-type(odd){
  background:var(--purple);
}

.discoverPost:nth-of-type(even){
  background:var(--blue);
}

.discoverPost:nth-of-type(3n){
  background:var(--orange);
}

.discoverPostText{
  font-size:20px;
  line-height:1.5;
}

.discoverMeta{
  color:var(--muted);
  font-size:13px;
  margin-top:13px;
}

.discoverAction{
  margin-top:16px;
}

.discoverEnd{
  text-align:center;
  padding:45px 10px 10px;
    }
  
/* Discover: a little gallery of thoughts */
.discoverIntro{
  margin-bottom:30px;
}

.discoverEyebrow{
  font-size:11px;
  letter-spacing:1.8px;
  color:var(--muted);
  margin-bottom:12px;
}

.discoverGallery{
  display:flex;
  flex-direction:column;
  gap:13px;
}

.discoverPiece{
  position:relative;
  border-radius:24px;
  padding:23px;
  overflow:hidden;
  border:1px solid rgba(80,65,50,.08);
}

.discoverPiece.piece-0{
  background:var(--yellow);
  padding:29px 25px;
  border-radius:30px 30px 12px 30px;
}

.discoverPiece.piece-1{
  background:transparent;
  border:0;
  border-bottom:1px solid var(--line);
  border-radius:0;
  padding:21px 8px;
}

.discoverPiece.piece-2{
  background:var(--green);
  margin-left:18px;
  border-radius:12px 28px 28px 28px;
}

.discoverPiece.piece-3{
  background:var(--blue);
  margin-right:18px;
  border-radius:28px 12px 28px 28px;
}

.discoverPiece.piece-4{
  background:var(--purple);
  border-radius:28px 28px 28px 12px;
}

.discoverPiece.piece-5{
  background:var(--orange);
  margin-left:10px;
  border-radius:28px 12px 28px 28px;
}

.discoverSymbol{
  font-size:22px;
  margin-bottom:13px;
  color:var(--accent);
}

.discoverPostText{
  font-size:20px;
  line-height:1.48;
  letter-spacing:-.25px;
  overflow-wrap:anywhere;
}

.piece-0 .discoverPostText{
  font-size:25px;
  line-height:1.38;
}

.discoverMeta{
  color:var(--muted);
  font-size:12px;
  margin-top:15px;
}

.discoverAction{
  margin-top:15px;
}

.discoverAction button{
  font-size:13px;
}

.discoverEnd{
  text-align:center;
  padding:40px 10px 15px;
}

@media(max-width:480px){
  .discoverPiece{
    padding:20px;
  }

  .discoverPiece.piece-0{
    padding:25px 21px;
  }

  .discoverPiece.piece-2{
    margin-left:10px;
  }

  .discoverPiece.piece-3{
    margin-right:10px;
  }
}

</style>
</head>

<body>
<div id="app"></div>

<script>
const interests = [
  'Questioning',
  'Learning',
  'Creating',
  'Nature',
  'Languages',
  'Ideas',
  'Maths',
  'Economics',
  'Books',
  'Travel',
  'Technology',
  'Drawing'
];

const seed = [
  ['Questioning','Why do we sometimes keep doing something even when we know we should stop?'],
  ['Languages','What makes a word feel beautiful in one language but ordinary in another?'],
  ['Nature','What is a place in nature that made you stop and just look?'],
  ['Creating','Why do people enjoy making things even when nobody sees them?'],
  ['Ideas','What is something people accept as normal that you think is worth questioning?'],
  ['Maths','What part of maths feels more like discovery than calculation?']
];

function getStored(key, fallback) {
  try {
    const value = localStorage.getItem(key);
    return value ? JSON.parse(value) : fallback;
  } catch {
    return fallback;
  }
}

const state = {
  tab: 'home',
  chosen: getStored('poviInterests', []),
  started: localStorage.getItem('poviStarted') === 'true',
  convo: null,
  posts: getStored('poviPosts', [])
  profile: getStored('poviProfile', {
  name: '',
  bio: '',
  learning: '',
  projects: ''
}),
};

function save() {
  try {
    localStorage.setItem(
      'poviInterests',
      JSON.stringify(state.chosen)
    );

    localStorage.setItem(
      'poviPosts',
      JSON.stringify(state.posts)
    );

    localStorage.setItem(
      'poviStarted',
      String(state.started)
    );
  } catch {}
}

function shell(content) {
  document.getElementById('app').innerHTML = `
    <div class="app">
      <div class="brand">povi</div>
      <div class="tag">connection, not popularity.</div>

      <main class="screen">
        ${content}
      </main>
    </div>

    ${
      state.started
        ? `
        <div class="nav">
          <div class="navin">
            <button class="${state.tab === 'home' ? 'active' : ''}" onclick="go('home')">
              ⌂ Home
            </button>

            <button class="${state.tab === 'convo' ? 'active' : ''}" onclick="go('convo')">
              ◌ Convo
            </button>

            <button class="${state.tab === 'discover' ? 'active' : ''}" onclick="go('discover')">
              ⌕ Discover
            </button>

            <button class="${state.tab === 'create' ? 'active' : ''}" onclick="go('create')">
              ＋ Create
            </button>
          
            <button class="${state.tab === 'profile' ? 'active' : ''}" onclick="go('profile')">
              ○ Profile
            </button>

          </div>
        </div>
        `
        : ''
    }
  `;
}

function go(tab) {
  state.tab = tab;
  state.convo = null;
  render();
}

function onboarding() {
  shell(`
    <div class="hero">
      What are you curious about today?
    </div>

    <p class="muted">
      Choose a few things. Povi uses them to help you find common ground—not to rank you.
    </p>

    <div class="chips">
      ${interests.map(x => `
        <button
          class="chip ${state.chosen.includes(x) ? 'on' : ''}"
          onclick="pick('${x}')"
        >
          ${x}
        </button>
      `).join('')}
    </div>

    <button
      class="primary"
      style="margin-top:22px"
      onclick="start()"
    >
      Continue
    </button>
  `);
}

function pick(x) {
  if (state.chosen.includes(x)) {
    state.chosen = state.chosen.filter(y => y !== x);
  } else {
    state.chosen = [...state.chosen, x];
  }

  save();
  onboarding();
}

function start() {
  if (!state.chosen.length) {
    alert('Choose at least one interest first.');
    return;
  }

  state.started = true;
  save();
  go('home');
}

function home() {
  const relevant = seed
    .filter(x => state.chosen.includes(x[0]))
    .slice(0,3);

  const homeInterests = state.chosen.slice(0,6);

  shell(`
    <div class="homeIntro">
      <div class="homeEyebrow">YOUR LITTLE CORNER</div>

      <h1 class="homeTitle">
        What are you curious about today?
      </h1>

      <p class="muted">
        A small reflection of what you're into, learning, and thinking about.
      </p>
    </div>

    ${
      homeInterests.length
        ? `
          <h3>Your interests</h3>

          <div class="interestWorld">
            ${homeInterests.map(x => `
              <button
                class="interest homeInterest"
                onclick="interestPage('${encodeURIComponent(x)}')"
              >
                ${escapeHtml(x)}
              </button>
            `).join('')}
          </div>
        `
        : ''
    }

    <h3>Your world</h3>

    ${
      relevant.length
        ? relevant.map(x => `
          <div
            class="smallThought homeQuestion"
            onclick="startConvo('${encodeURIComponent(x[1])}')"
          >
            <div class="thoughtDot">☆</div>

            <div>
              <div class="thoughtText">
                ${escapeHtml(x[1])}
              </div>

              <div class="thoughtMeta">
                ${escapeHtml(x[0])} · explore together
              </div>
            </div>
          </div>
        `).join('')
        : `
          <div class="smallThought">
            <div class="thoughtText">
              Choose some interests and your world will start taking shape.
            </div>
          </div>
        `
    }

    <div class="card" style="text-align:center;margin-top:42px">
      <b>You're caught up.</b>

      <p class="muted">
        That's enough for now. 🌱
      </p>
    </div>
  `);
}



function interestPage(interest) {
  const value = decodeURIComponent(interest);

  state.tab = 'discover';
  renderInterest(value);
}

function renderInterest(interest) {
  const posts = [
    ...state.posts
      .filter(p => p.interest === interest)
      .map(p => [p.interest, p.text, 'You']),

    ...seed.filter(x => x[0] === interest)
  ];

  shell(`
    <h1>${escapeHtml(interest)}</h1>

    <p class="muted">
      A small window into this part of your world.
    </p>

    ${
      posts.length
        ? posts.map(x => `
          <div class="card">
            <div class="count">
              ${escapeHtml(x[0])} · ${escapeHtml(x[2])}
            </div>

            <div class="post">
              ${escapeHtml(x[1])}
            </div>

            <button
              class="ghost"
              style="margin-top:12px"
              onclick="startConvo('${encodeURIComponent(x[1])}')"
            >
              Question this
            </button>
          </div>
        `).join('')
        : `
          <div class="card">
            <b>Nothing here yet.</b>

            <p class="muted">
              This could become a little corner for ${escapeHtml(interest)}.
            </p>
          </div>
        `
    }
  `);
}
function convo() {
  const relevant = seed.filter(x =>
    state.chosen.includes(x[0])
  );

  const questions = relevant.length
    ? relevant
    : seed.slice(0,3);

  shell(`
    <div class="convoIntro">
      <div class="convoEyebrow">A LITTLE CORNER FOR CURIOSITY</div>

      <h1>Think about it together.</h1>

      <p class="muted">
        You don't need the same answer.
        Just start with the same question.
      </p>
    </div>

    ${questions.map((x, i) => `
      <div
        class="convoQuestion"
        onclick="startConvo('${encodeURIComponent(x[1])}')"
      >
        <div class="convoStar">☆</div>

        <div class="convoText">
          ${escapeHtml(x[1])}
        </div>

        <div class="convoMeta">
          ${escapeHtml(x[0])}
        </div>

        <div class="convoHint">
          Someone wondered about this.
        </div>

        <div class="convoArrow">
          Step inside →
        </div>
      </div>
    `).join('')}
  `);
  }

function startConvo(q) {
  state.convo = decodeURIComponent(q);
  renderConversation();
}

function renderConversation() {
  shell(`
    <div class="convoRoom">

      <button class="backLink" onclick="go('convo')">
        ← Back to Convo
      </button>

      <div class="convoEyebrow">
        A QUESTION TO EXPLORE
      </div>

      <div class="roomQuestion">
        ☆ ${escapeHtml(state.convo)}
      </div>

      <p class="roomPrompt">
        You don't need an answer.
        Just say what you're thinking.
      </p>

      <div id="msgs">

        <div class="card">
          <b>Povi</b>

          <p class="post">
            You don't have to know the answer. That's the point.
          </p>
        </div>

      </div>

      <div class="messageArea">

        <textarea
          id="msg"
          class="input"
          placeholder="What do you think?"
        ></textarea>

        <button
          class="primary"
          style="margin-top:10px"
          onclick="send()"
        >
          Share thought
        </button>

        <button
          class="ghost"
          style="margin:10px 0 0 8px"
          onclick="finish()"
        >
          Leave
        </button>

      </div>

    </div>
  `);
  }

function send() {
  const input = document.getElementById('msg');

  if (!input) return;

  const value = input.value.trim();

  if (!value) return;

  document.getElementById('msgs').innerHTML += `
    <div class="card">
      <b>You</b>
      <p class="post">${escapeHtml(value)}</p>
    </div>
  `;

  input.value = '';
}

function finish() {
  state.convo = null;
  go('home');
}


function discover() {
  const posts = [
    ...state.posts.map(p => [p.interest, p.text, 'You']),
    ...seed
  ].slice(0, 6);

  shell(`
    <div class="discoverIntro">
      <div class="discoverEyebrow">A WINDOW INTO OTHER WORLDS</div>

      <h1>Look around.</h1>

      <p class="muted">
        Questions, little discoveries, and things worth thinking about.
        Take what interests you. Leave the rest.
      </p>
    </div>

    <div class="discoverGallery">
      ${posts.map((x, i) => `
        <div class="discoverPiece piece-${i % 6}">
          <div class="discoverSymbol">☆</div>

          <div class="discoverPostText">
            ${escapeHtml(x[1])}
          </div>

          <div class="discoverMeta">
            ${escapeHtml(x[0])} · ${x[2] === 'You' ? 'Your post' : 'Povi prompt'}
          </div>

          <div class="discoverAction">
            <button
              class="ghost"
              onclick="startConvo('${encodeURIComponent(x[1])}')"
            >
              Explore this thought →
            </button>
          </div>
        </div>
      `).join('')}
    </div>

    <div class="discoverEnd">
      <b>You've seen this little corner.</b>

      <p class="muted">
        There's a world beyond the screen, too. 🌱
      </p>
    </div>
  `);
}


function create() {
  shell(`
    <h1>Create something.</h1>

    <p class="muted">
      Share a thought, question, or small thing you made.
    </p>

    <div class="card">
      <input
        id="pt"
        class="input"
        placeholder="What's on your mind?"
      >

      <div style="height:10px"></div>

      <select id="pi" class="input">
        ${interests.map(x => `
          <option>${x}</option>
        `).join('')}
      </select>

      <button
        class="primary"
        style="margin-top:12px"
        onclick="post()"
      >
        Post
      </button>
    </div>
  `);
}

function post() {
  const input = document.getElementById('pt');
  const select = document.getElementById('pi');

  if (!input || !select) return;

  const text = input.value.trim();

  if (!text) return;

  state.posts.unshift({
    text: text,
    interest: select.value
  });

  save();
  go('discover');
}

function escapeHtml(value) {
  return String(value).replace(
    /[&<>"']/g,
    char => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#039;'
    }[char])
  );
}

function render() {
  if (!state.started) {
    onboarding();
    return;
  }

  const screens = {
    home,
    convo,
    discover,
    create
  };

  (screens[state.tab] || home)();
}

render();
</script>
</body>
</html>

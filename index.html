<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Povi — Connection, not popularity</title>

<style>
:root{
  --bg:#f3eadb;
  --paper:#fffaf1;
  --paper2:#f8f0e4;
  --ink:#302923;
  --muted:#756b61;
  --line:#dfd1bf;

  --green:#607c62;
  --greenSoft:#dce7d7;

  --yellow:#e8c979;
  --yellowSoft:#f7e9b9;

  --blue:#718aa1;
  --blueSoft:#dce7ef;

  --purple:#8a7898;
  --purpleSoft:#e6ddea;

  --orange:#c98c5b;
  --orangeSoft:#f0dfcf;
}

*{
  box-sizing:border-box
}

body{
  margin:0;
  background:
    radial-gradient(circle at 10% 5%,rgba(232,201,121,.22),transparent 24%),
    radial-gradient(circle at 90% 20%,rgba(113,138,161,.14),transparent 25%),
    var(--bg);
  color:var(--ink);
  font:16px system-ui,-apple-system,Segoe UI,sans-serif;
}

button,input,select{
  font:inherit
}

button{
  cursor:pointer
}

.app{
  max-width:760px;
  margin:auto;
  min-height:100vh;
  padding:22px 22px 30px;
}

.brand{
  font-weight:850;
  font-size:29px;
  letter-spacing:.5px;
  color:var(--green);
}

.tag{
  color:var(--muted);
  margin-top:1px;
  font-size:14px;
}

.screen{
  padding:45px 0 105px;
}

h1{
  font-size:clamp(31px,7vw,48px);
  line-height:1.06;
  letter-spacing:-1.5px;
  margin:0 0 14px;
}

h3{
  margin:34px 0 12px;
}

.hero{
  font-size:clamp(39px,8vw,65px);
  line-height:1;
  letter-spacing:-3px;
  margin:35px 0 20px;
}

.muted{
  color:var(--muted);
  line-height:1.55;
}

/* ---------- GENERAL SURFACES ---------- */

.card{
  background:var(--paper);
  border:1px solid rgba(223,209,191,.8);
  border-radius:25px;
  padding:22px;
  margin:14px 0;
  box-shadow:0 7px 24px rgba(73,55,38,.055);
}

.card.soft{
  background:var(--paper2);
  box-shadow:none;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:20px;
  align-items:center;
}

/* ---------- COLOURED AREAS ---------- */

.feature{
  border-radius:30px;
  padding:27px;
  margin:24px 0;
  position:relative;
  overflow:hidden;
}

.feature.green{
  background:var(--greenSoft);
}

.feature.yellow{
  background:var(--yellowSoft);
}

.feature.blue{
  background:var(--blueSoft);
}

.feature.purple{
  background:var(--purpleSoft);
}

.feature.orange{
  background:var(--orangeSoft);
}

.feature::after{
  content:"";
  position:absolute;
  width:120px;
  height:120px;
  border-radius:50%;
  right:-35px;
  top:-40px;
  background:rgba(255,255,255,.28);
}

.feature > *{
  position:relative;
  z-index:1;
}

.featureTitle{
  font-size:23px;
  font-weight:750;
  margin-bottom:7px;
}

.emoji{
  font-size:28px;
  margin-bottom:14px;
}

/* ---------- CHIPS ---------- */

.chips{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
  margin-top:25px;
}

.chip{
  border:1px solid var(--line);
  background:var(--paper);
  color:var(--ink);
  border-radius:999px;
  padding:10px 15px;
  transition:.15s;
}

.chip:nth-child(4n+1){
  background:var(--greenSoft);
  border-color:#cbd9c7;
}

.chip:nth-child(4n+2){
  background:var(--yellowSoft);
  border-color:#ead99e;
}

.chip:nth-child(4n+3){
  background:var(--blueSoft);
  border-color:#cad9e3;
}

.chip:nth-child(4n){
  background:var(--purpleSoft);
  border-color:#d7c9df;
}

.chip.on{
  background:var(--ink);
  color:white;
  border-color:var(--ink);
}

/* ---------- BUTTONS ---------- */

.primary{
  background:var(--green);
  color:#fff;
  border:0;
  border-radius:999px;
  padding:13px 20px;
  transition:.15s;
}

.ghost{
  background:rgba(255,250,241,.65);
  color:var(--ink);
  border:1px solid var(--line);
  border-radius:999px;
  padding:11px 17px;
  transition:.15s;
}

.primary:hover,
.ghost:hover,
.chip:hover{
  transform:translateY(-1px);
}

/* ---------- QUESTIONS ---------- */

.question{
  font-size:23px;
  line-height:1.35;
  margin:8px 0;
}

.questionCard{
  background:var(--yellowSoft);
  border:1px solid #ead99e;
  border-radius:25px;
  padding:22px;
  margin:14px 0;
}

.count{
  font-size:12px;
  color:var(--muted);
  text-transform:none;
  letter-spacing:.5px;
  font-weight:650;
}

/* ---------- POSTS ---------- */

.postCard{
  background:var(--paper);
  border:1px solid rgba(223,209,191,.8);
  border-radius:25px;
  padding:22px;
  margin:14px 0;
  box-shadow:0 7px 24px rgba(73,55,38,.045);
}

.post{
  white-space:pre-wrap;
  line-height:1.6;
  margin-top:9px;
}

/* ---------- INPUTS ---------- */

.input{
  width:100%;
  padding:15px;
  border:1px solid var(--line);
  border-radius:17px;
  background:rgba(255,250,241,.8);
  color:var(--ink);
  outline:none;
}

.input:focus{
  border-color:var(--green);
  box-shadow:0 0 0 3px rgba(96,124,98,.12);
}

select.input{
  appearance:auto;
}

/* ---------- NAV ---------- */

.nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:rgba(243,234,219,.91);
  border-top:1px solid var(--line);
  backdrop-filter:blur(15px);
  z-index:20;
}

.navin{
  max-width:760px;
  margin:auto;
  display:flex;
  justify-content:space-around;
  padding:9px 6px;
}

.nav button{
  border:0;
  background:transparent;
  color:var(--muted);
  padding:8px 12px;
  border-radius:14px;
}

.nav button.active{
  color:var(--green);
  background:var(--greenSoft);
  font-weight:750;
}

.small{
  font-size:13px;
}

@media(max-width:520px){
  .app{
    padding-left:17px;
    padding-right:17px;
  }

  .screen{
    padding-top:35px;
  }

  .feature{
    padding:23px;
    border-radius:25px;
  }

  .card,
  .postCard,
  .questionCard{
    border-radius:22px;
  }
}
</style>
</head>

<body>
<div id="app"></div>
